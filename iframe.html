<script>
const SUPABASE_URL = "https://pjvvyvfcwjoocjqvdror.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NYqRoKptTgcL90VAVF2kqA_Gl06mEUF";
const DEFAULT_ROUTE = "rt-a8f31";
const PLATFORM_URL = "https://bet-300.pw";
let sb=null;try{if(SUPABASE_ANON_KEY&&!SUPABASE_ANON_KEY.includes("PEGAR_"))sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){console.warn(e)}
const state={publicCode:new URLSearchParams(location.search).get("r")||DEFAULT_ROUTE,pcCodigo:null,usuario:localStorage.getItem("bet300_usuario")||"",solicitudId:localStorage.getItem("bet300_solicitud_id")||"",chatId:localStorage.getItem("bet300_chat_id")||"",chatToken:localStorage.getItem("bet300_chat_token")||"",selectedFile:null,billetera:null,chatLibre:false,pendingTipo:localStorage.getItem("bet300_pending_tipo")||"",seenMsgIds:new Set()};
let chatPollTimer=null;
function doneKey(id){return "bet300_done_notified_"+String(id||"")}
function $(id){return document.getElementById(id)}function esc(t){return String(t??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function now(){return new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200)}function scrollBottom(){const b=$("widgetBody");b.scrollTop=b.scrollHeight}function toggleWidget(open){$("widget").classList.toggle("open",!!open);if(open){setTimeout(scrollBottom,80);if(state.chatId)startChatPoll();if(state.solicitudId)startSolicitudPoll()}else stopChatPoll()}
function addMsg(text,who="bot"){const wrap=document.createElement("div");wrap.className="msg "+(who==="user"?"user":"bot");wrap.innerHTML='<div class="bubble">'+String(text)+'</div><div class="meta">'+(who==="user"?"Vos":"BET300")+" · "+now()+'</div>';$("messages").appendChild(wrap);scrollBottom()}
async function rpc(fn,params){if(!sb)return{data:null,error:{message:"Supabase no configurado"}};const{data,error}=await sb.rpc(fn,params||{});return{data,error}}function normalize(data){if(!data)return null;if(Array.isArray(data))return data[0]||null;if(data.data)return Array.isArray(data.data)?data.data[0]:data.data;return data}

let solicitudPollTimer=null;
function uniqueList(arr){return [...new Set((arr||[]).map(v=>String(v||"").trim()).filter(Boolean))]}
function pcCandidatesPortal(){
  const raw=String(state.pcCodigo||"P1").trim().toUpperCase();
  const out=[raw,"P1"];
  if(/^P\d+$/.test(raw)) out.push("PC"+raw.replace("P",""));
  if(/^PC\d+$/.test(raw)) out.push("P"+raw.replace("PC",""));
  return uniqueList(out);
}
function saveChatFromRow(row){
  const d=normalize(row)||row||{};
  const chatId=d.chat_id||d.chatId||d.chat_session_id||d.session_id||d.sesion_id||"";
  const token=d.chat_token||d.chatToken||d.chat_public_token||d.public_token||"";
  if(chatId){state.chatId=String(chatId);localStorage.setItem("bet300_chat_id",state.chatId)}
  if(token){state.chatToken=String(token);localStorage.setItem("bet300_chat_token",state.chatToken)}
  return {chatId:state.chatId,chatToken:state.chatToken};
}
function isNumericId(v){return /^\d+$/.test(String(v||"").trim())}
async function ensureChatForPortal(tipo){
  if(state.chatId&&state.chatToken) return true;
  const sid=isNumericId(state.solicitudId)?Number(state.solicitudId):null;
  let res=await rpc("landing_crear_chat_v2",{
    p_usuario:state.usuario,
    p_telefono:"",
    p_pc_codigo:state.pcCodigo||"P1",
    p_solicitud_id:sid
  });
  if(!res.error){
    saveChatFromRow(res.data);
    if(state.chatId&&state.chatToken){startChatPoll();return true;}
  }
  // Fallback a la RPC blindada del portal si existe.
  res=await rpc("landing_crear_chat_v2_blindado",{
    p_public_code:state.publicCode,
    p_usuario:state.usuario,
    p_mensaje:"",
    p_tipo:tipo||"SOPORTE",
    p_extra:{pc_codigo:state.pcCodigo,public_code:state.publicCode,solicitud_id:state.solicitudId||null}
  });
  if(!res.error){
    saveChatFromRow(res.data);
    if(state.chatId&&state.chatToken){startChatPoll();return true;}
  }
  return false;
}
function clearPendingAfterDone(estado){
  const e=String(estado||"").toUpperCase();
  if(!["ACREDITADA","PAGADA","COMPLETADA","RECHAZADA","ERROR"].includes(e)) return false;

  const oldSolicitudId = state.solicitudId;
  stopSolicitudPoll();

  ["bet300_pending_tipo","bet300_solicitud_id"].forEach(k=>localStorage.removeItem(k));
  state.pendingTipo="";
  state.solicitudId="";

  // Limpiar visualmente la solicitud pendiente sin refrescar la página.
  document.getElementById("pendingBox")?.remove();
  document.querySelectorAll(".active-flow,.form-box.submitted").forEach(el=>el.remove());
  document.getElementById("limpiarConfirm")?.remove();

  // Si quedó el chip/modo pendiente, reconstruir menú normal.
  renderUserGate();

  // El chat queda disponible para soporte, pero ya no bloquea el menú.
  setComposeEnabled(false,"Elegí una opción para continuar.");
  scrollBottom();
  return true;
}
function stopSolicitudPoll(){
  if(solicitudPollTimer){clearInterval(solicitudPollTimer);solicitudPollTimer=null}
}
function startSolicitudPoll(){
  stopSolicitudPoll();
  if(!state.solicitudId) return;

  const tickEstado = async()=>{
    const currentSolicitudId = state.solicitudId;
    if(!currentSolicitudId) return;
    const d=await consultarEstadoSolicitud();
    const estado=String(d?.estado||"").toUpperCase();

    if(["ACREDITADA","PAGADA","COMPLETADA"].includes(estado)){
      const k=doneKey(currentSolicitudId);
      if(localStorage.getItem(k)!=="1"){
        localStorage.setItem(k,"1");
        addMsg("✅ Tu solicitud fue aprobada. Ya podés revisar tus fichas/saldo.","bot");
      }
      clearPendingAfterDone(estado);
    }else if(["RECHAZADA","ERROR"].includes(estado)){
      const k=doneKey(currentSolicitudId);
      if(localStorage.getItem(k)!=="1"){
        localStorage.setItem(k,"1");
        addMsg("La solicitud fue cerrada con estado: <b>"+esc(estado)+"</b>. Si necesitás ayuda, escribinos.","bot");
      }
      clearPendingAfterDone(estado);
    }
  };

  // Primera consulta inmediata: evita esperar/refrescar para que cambie el estado.
  tickEstado();
  solicitudPollTimer=setInterval(tickEstado,2500);
}
async function consultarEstadoSolicitud(){
  if(!state.solicitudId) return null;

  // Firma usada por el portal V16 si existe.
  let res=await rpc("landing_estado_solicitud_segura",{
    p_public_code:state.publicCode,
    p_solicitud_id:String(state.solicitudId)
  });
  if(!res.error){
    return normalize(res.data)||res.data;
  }

  // Firma segura clásica: solicitud + chat numérico + token.
  if(isNumericId(state.solicitudId) && isNumericId(state.chatId) && state.chatToken){
    res=await rpc("landing_estado_solicitud_segura",{
      p_solicitud_id:Number(state.solicitudId),
      p_chat_id:Number(state.chatId),
      p_chat_token:state.chatToken
    });
    if(!res.error){
      return normalize(res.data)||res.data;
    }
  }

  // Fallback directo controlado: solo lee el estado de esa solicitud.
  try{
    const q=await sb.from("solicitudes").select("id,estado,tipo,usuario,monto,updated_at").eq("id",Number(state.solicitudId)).maybeSingle();
    if(!q.error && q.data) return q.data;
  }catch(e){}
  return null;
}

function startChatPoll(){
  stopChatPoll();
  if(!state.chatId)return;
  chatPollTimer=setInterval(pollOperatorMessages,3500);
}
function stopChatPoll(){
  if(chatPollTimer){clearInterval(chatPollTimer);chatPollTimer=null}
}
async function pollOperatorMessages(){
  if(!state.chatId||!$("widget")?.classList.contains("open"))return;
  const res=await rpc("landing_leer_chat_v2",{p_chat_id:Number(state.chatId),p_chat_token:state.chatToken});
  if(res.error||!Array.isArray(res.data))return;
  res.data.forEach(m=>{
    const msgKey=String(m.id||m.created_at||JSON.stringify(m));
    if(state.seenMsgIds.has(msgKey))return;
    state.seenMsgIds.add(msgKey);
    const emisor=String(m.tipo_emisor||m.emisor||"").toUpperCase();
    const isOp=emisor.includes("OPER")||emisor.includes("ADMIN")||emisor.includes("PANEL")||emisor.includes("SIST")||emisor.includes("BOT")||emisor.includes("AUTO");
    const texto=m.mensaje||m.texto||"";
    if(isOp&&texto)addMsg(esc(texto),"bot");
  });
}

function setComposeEnabled(enabled, text){
  state.chatLibre=!!enabled;
  const box=$("composeBox");
  const lock=$("composeLockText");
  if(!box) return;
  box.classList.toggle("locked", !enabled);
  if(lock) lock.textContent=text || "Elegí una opción para continuar.";
  const input=$("freeInput");
  if(input && enabled) setTimeout(()=>input.focus(),80);
}
function renderUserGate(){
  const gate=$("userGate");
  const menu=$("mainMenu");
  if(!gate || !menu) return;

  if(!state.usuario){
    gate.classList.remove("hidden");
    gate.classList.remove("pending-mode");
    menu.classList.add("hidden");
    menu.classList.add("main-menu-disabled");
    setComposeEnabled(false,"Primero indicá tu usuario de plataforma.");
    gate.innerHTML=`<div class="user-gate-title">Bienvenido a BET300 Asistencia 👋</div>
      <div class="welcome-txt">Para ayudarte con cargas, retiros o soporte, indicá tu usuario de plataforma. No pedimos tu clave.</div>
      <label style="margin-top:12px">Usuario de plataforma</label>
      <input id="usuarioInicial" placeholder="Ej: usuario123" autocomplete="username">
      <button class="action-btn" onclick="guardarUsuarioInicial()">Continuar</button>
      <div class="flow-note">Este usuario queda recordado en este dispositivo para próximas operaciones.</div>`;
    return;
  }

  gate.classList.remove("hidden");

  if(tieneSolicitudPendiente()){
    gate.classList.add("pending-mode");
    menu.classList.add("hidden");
    menu.classList.add("main-menu-disabled");
    gate.innerHTML=`<div class="user-chip">👤 ${esc(state.usuario)}</div>
      <div class="welcome-title" style="font-size:16px;margin-top:8px">Tenés una solicitud en revisión</div>
      <div class="welcome-txt">Para evitar duplicados, no se pueden iniciar nuevas cargas, retiros ni consultas generales hasta que esta solicitud se cierre.</div>
      <div class="pending-only-actions">
        <button class="action-btn secondary-btn" onclick="verEstado()">Ver estado</button>

async function initRoute(){const r=await rpc("landing_resolver_ruta_publica",{p_public_code:state.publicCode});if(!r.error){const row=normalize(r.data);state.pcCodigo=row?.pc_codigo||row?.pc||row?.codigo_pc||null}if(!state.pcCodigo){const map={"rt-a8f31":"P1","rt-k6d92":"P2","rt-m4q77":"P3","rt-z9p42":"P4","rt-x2v61":"P5"};state.pcCodigo=map[state.publicCode]||"P1"}console.log("[BET300 V16] canal",state.pcCodigo,"ruta",state.publicCode)}
function startFlow(tipo){
  if(!state.usuario){ renderUserGate(); return toast("Primero indicá tu usuario"); }

async function renderCargaForm(){
  $("messages").insertAdjacentHTML("beforeend",`<div id="formCargaActiva" class="form-box active-flow">

  const alias=b?.alias||"",cbu=b?.cbu||b?.cvu||"",nombre=b?.nombre_visible||b?.nombre||"",banco=b?.banco||b?.tipo||"";
  slot.innerHTML=`<div class="transfer-card" style="margin:0 0 10px">

    ${cbu?`<div class="transfer-field"><div class="transfer-label">CBU / CVU</div><div class="transfer-value">${esc(cbu)}</div><button class="copy-btn" onclick="copyText('${esc(cbu)}',this)">Copiar CBU / CVU</button></div>`:""}

async function obtenerBilletera(){
  state.billetera=null;
  const candidatos=pcCandidatesPortal();

  // 1) Camino correcto para esta base: landing_obtener_billetera(p_pc_codigo).
  for(const pc of candidatos){
    const res=await rpc("landing_obtener_billetera",{p_pc_codigo:pc});
    if(!res.error){
      const row=normalize(res.data)||res.data;
      if(row && (!Array.isArray(res.data) || res.data.length)){
        state.billetera=row;
        return state.billetera;
      }
    }
  }

  // 2) Compatibilidad con versiones que aceptan public_code.
  const resPub=await rpc("landing_obtener_billetera",{p_public_code:state.publicCode});
  if(!resPub.error){
    const row=normalize(resPub.data)||resPub.data;
    if(row && (!Array.isArray(resPub.data) || resPub.data.length)){
      state.billetera=row;
      return state.billetera;
    }
  }

  // 3) Último fallback REST: billetera marcada manual para el PC.
  for(const pc of candidatos){
    try{
      const q=await sb.from("billeteras")
        .select("id,pc_codigo,nombre_visible,titular,alias,cbu,banco,seleccionada_manual,activa")
        .eq("pc_codigo",pc)
        .eq("activa",true)
        .eq("seleccionada_manual",true)
        .limit(1)
        .maybeSingle();
      if(!q.error && q.data){
        state.billetera=q.data;
        return state.billetera;
      }
    }catch(e){}
  }

  return null;
}

async function enviarSolicitudCarga(usuario,monto,titular){
  if(!state.billetera) await obtenerBilletera();
  const payload={
    usuario,
    monto:Number(monto),
    titular,
    pc_codigo:state.pcCodigo,
    public_code:state.publicCode,
    tipo:"CARGA",
    billetera:state.billetera,
    billetera_id:state.billetera?.id||null,
    billetera_nombre:state.billetera?.nombre_visible||state.billetera?.nombre||null
  };

  let res=await rpc("landing_portal_v16_crear_solicitud",{
    p_public_code:state.publicCode,
    p_usuario:usuario,
    p_tipo:"CARGA",
    p_monto:Number(monto),
    p_titular:titular,
    p_destino:null,
    p_mensaje:"Solicitud de CARGA: $"+monto+" · Titular: "+titular,
    p_metadata:payload
  });

  if(res.error){
    console.warn("[V16.4] landing_portal_v16_crear_solicitud falló",res.error);
    res=await rpc("landing_crear_solicitud_v3_blindado",{
      p_public_code:state.publicCode,
      p_usuario:usuario,
      p_tipo:"CARGA",
      p_monto:Number(monto),
      p_titular:titular,
      p_comprobante_url:null,
      p_extra:payload
    });
  }

  if(res.error){
    res=await rpc("landing_crear_chat_v2_blindado",{
      p_public_code:state.publicCode,
      p_usuario:usuario,
      p_mensaje:"Solicitud de CARGA: $"+monto+" · Titular: "+titular,
      p_tipo:"CARGA",
      p_extra:payload
    });
  }

  if(res.error){
    addMsg("No pudimos enviar la solicitud automáticamente. Escribinos por acá y un operador te responde.","bot");
    setComposeEnabled(true,"");
    return;
  }

  const data=normalize(res.data)||res.data||{};
  const solicitudId=data?.solicitud_id||data?.id||data?.solicitudId||"";
  saveChatFromRow(data);

  if(!state.chatId || !state.chatToken){
    if(solicitudId) state.solicitudId=String(solicitudId);
    await ensureChatForPortal("CARGA");
  }

  setPendiente("CARGA",solicitudId);
  if(state.chatId) localStorage.setItem("bet300_chat_id",state.chatId);
  if(state.chatToken) localStorage.setItem("bet300_chat_token",state.chatToken);

  addMsg('Solicitud recibida ✅<br><span class="status-pill">En verificación</span><br>Un operador va a revisar la transferencia. Podés escribir por este chat si necesitás.',"bot");
  renderUserGate();
  renderPendingBox();
  setComposeEnabled(true,"Podés agregar un comentario sobre tu solicitud.");
  startChatPoll();
  startSolicitudPoll();
}
function renderRetiroForm(){$("messages").insertAdjacentHTML("beforeend",`<div id="formRetiroActiva" class="form-box active-flow"><div class="welcome-title" style="font-size:16px">🏧 Solicitud de retiro</div><div class="welcome-txt" style="margin-bottom:10px">El retiro queda sujeto a revisión de cuenta y saldo disponible.</div><div class="user-chip">👤 ${esc(state.usuario)}</div><div class="form-row"><div><label>Monto</label><input id="retiroMonto" type="number" min="1" placeholder="Ej: 10000"></div><div><label>Alias/CBU destino</label><input id="retiroDestino" placeholder="Alias o CBU/CVU"></div></div><label>Titular destino</label><input id="retiroTitular" placeholder="Nombre del titular"><button class="action-btn" onclick="enviarSolicitudRetiro()">Enviar retiro a revisión</button></div>`);scrollBottom()}

async function enviarSoporte(){
  const usuario=state.usuario,mensaje=$("soporteMensaje").value.trim();
  if(!mensaje)return toast("Escribí tu consulta");
  addMsg(mensaje,"user");

  await ensureChatForPortal("SOPORTE");
  let ok=false;
  if(state.chatId&&state.chatToken&&isNumericId(state.chatId)){
    const env=await rpc("landing_enviar_mensaje_v2",{
      p_chat_id:Number(state.chatId),
      p_chat_token:state.chatToken,
      p_emisor:usuario,
      p_mensaje:mensaje,
      p_imagen_url:""
    });
    ok=!env.error;
  }

  if(!ok){
    const res=await rpc("landing_crear_chat_v2_blindado",{
      p_public_code:state.publicCode,
      p_usuario:usuario,
      p_mensaje:mensaje,
      p_tipo:"SOPORTE",
      p_extra:{pc_codigo:state.pcCodigo,public_code:state.publicCode}
    });
    if(res.error){addMsg("No pudimos crear el chat automáticamente. Intentá nuevamente.","bot");return}
    saveChatFromRow(res.data);
  }

  cerrarFormActivo("formSoporteActiva");
  addMsg("Consulta enviada ✅ Un operador te responde por este mismo chat.","bot");
  setComposeEnabled(true,"");
  startChatPoll();
}
async function sendFreeMessage(){
  if(!state.chatLibre)return toast("Elegí una opción para continuar");
  const input=$("freeInput"),txt=input.value.trim();
  if(!txt)return;
  input.value="";
  addMsg(esc(txt),"user");
  if(!state.usuario){
    addMsg("Para ayudarte mejor, indicá tu usuario de plataforma o elegí una opción del menú.","bot");
    return;
  }

  await ensureChatForPortal(state.pendingTipo||"SOPORTE");

  let sent=false;
  if(state.chatId&&state.chatToken&&isNumericId(state.chatId)){
    const res=await rpc("landing_enviar_mensaje_v2",{
      p_chat_id:Number(state.chatId),
      p_chat_token:state.chatToken,
      p_emisor:state.usuario,
      p_mensaje:txt,
      p_imagen_url:""
    });
    sent=!res.error;
  }

  if(!sent){
    const res=await rpc("landing_crear_chat_v2_blindado",{
      p_public_code:state.publicCode,
      p_usuario:state.usuario,
      p_mensaje:txt,
      p_tipo:state.pendingTipo||"SOPORTE",
      p_extra:{pc_codigo:state.pcCodigo,public_code:state.publicCode,solicitud_id:state.solicitudId||null}
    });
    if(!res.error) saveChatFromRow(res.data);
  }
  startChatPoll();
}
async function verEstado(){
  if(!state.solicitudId){
    addMsg("Todavía no encontramos una solicitud reciente en este dispositivo. Podés iniciar una carga, retiro o escribir a soporte.","bot");
    return;
  }
  const d=await consultarEstadoSolicitud();
  if(!d){
    addMsg("No pude consultar el estado ahora. Intentá nuevamente en unos minutos.","bot");
    return;
  }
  const estado=String(d?.estado||"En revisión");
  addMsg("Estado actual: <b>"+esc(estado)+"</b>","bot");
  clearPendingAfterDone(estado);
}
