<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>BET300 · Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
:root{--bg:#050510;--panel:#111222;--line:rgba(255,255,255,.12);--text:#f8fafc;--muted:#a7adbd;--gold:#f5c542;--green:#18c964;--blue:#3d5afe;--shadow:0 18px 60px rgba(0,0,0,.45)}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
#appFrame{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#050510;z-index:1}
.float-btn{position:fixed;right:18px;bottom:18px;z-index:20;border:none;border-radius:999px;padding:14px 18px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--gold),#ffe27a);color:#171200;font-weight:950;font-size:15px;cursor:pointer;box-shadow:0 12px 38px rgba(245,197,66,.32),0 14px 45px rgba(0,0,0,.45)}
.widget{position:fixed;right:18px;bottom:84px;z-index:30;width:390px;max-width:calc(100vw - 24px);height:620px;max-height:calc(100vh - 105px);background:linear-gradient(180deg,rgba(25,26,44,.96),rgba(10,11,22,.98));border:1px solid rgba(255,255,255,.14);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:none;flex-direction:column;backdrop-filter:blur(16px)}
.widget.open{display:flex}
.widget-head{padding:16px;background:radial-gradient(circle at top right,rgba(245,197,66,.18),transparent 32%),linear-gradient(135deg,#17182b,#0c0d1a);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand-logo{font-size:22px;font-weight:950;letter-spacing:-1px}.brand-logo span:first-child{color:var(--gold)}.head-sub{font-size:11px;color:var(--muted);margin-top:2px}
.icon-btn{border:none;background:rgba(255,255,255,.09);color:#fff;border-radius:12px;width:34px;height:34px;cursor:pointer;font-size:18px}
.widget-body{flex:1;overflow:auto;padding:14px;background:radial-gradient(circle at 20% 20%,rgba(61,90,254,.09),transparent 28%),radial-gradient(circle at 80% 55%,rgba(245,197,66,.07),transparent 30%),#0b0c18}
.welcome-card,.form-box{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:14px;margin-bottom:12px}
.welcome-title{font-weight:950;font-size:18px;margin-bottom:6px}.welcome-txt{font-size:13px;color:#d7dbe7;line-height:1.35}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.quick{border:1px solid rgba(255,255,255,.1);background:#15172a;color:#fff;border-radius:16px;padding:13px 10px;cursor:pointer;text-align:left;font-weight:900;min-height:68px}
.quick small{display:block;color:var(--muted);font-size:11px;font-weight:600;margin-top:4px;line-height:1.25}.quick.gold{background:linear-gradient(135deg,#2b230d,#17172a);border-color:rgba(245,197,66,.35)}.quick.green{background:linear-gradient(135deg,#0d2b1a,#17172a);border-color:rgba(24,201,100,.28)}
.msg{display:flex;flex-direction:column;margin-bottom:10px;max-width:88%}.msg.bot,.msg.sys{align-items:flex-start;margin-right:auto}.msg.user{align-items:flex-end;margin-left:auto}
.bubble{padding:10px 12px;border-radius:16px;font-size:13px;line-height:1.36;word-break:break-word;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.msg.bot .bubble,.msg.sys .bubble{background:#1d2334;color:#f7f7fb;border-bottom-left-radius:5px;border:1px solid rgba(255,255,255,.04)}.msg.user .bubble{background:linear-gradient(135deg,#314bd8,#6879ff);color:#fff;border-bottom-right-radius:5px}.meta{font-size:10px;color:var(--muted);padding:3px 4px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#c7cbd6;font-weight:900;margin-bottom:5px}
input,textarea{width:100%;border:1px solid rgba(255,255,255,.12);background:#fff;color:#111;border-radius:13px;padding:12px;font-size:15px;margin-bottom:10px}textarea{resize:vertical;min-height:76px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.action-btn{width:100%;border:none;border-radius:14px;padding:13px 14px;font-weight:950;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--gold),#ffe27a);color:#141008;margin-top:3px}.secondary-btn{background:#262b3d;color:#fff;border:1px solid rgba(255,255,255,.10)}
.transfer-card{background:linear-gradient(180deg,#1a2035,#111728);border:1px solid rgba(245,197,66,.42);border-radius:18px;padding:13px;margin:10px 0;box-shadow:0 12px 28px rgba(0,0,0,.24)}
.transfer-title{font-weight:950;color:var(--gold);font-size:16px;margin-bottom:10px}.transfer-field{background:#0e1525;border-radius:13px;padding:10px;margin-bottom:8px;border:1px solid rgba(255,255,255,.06)}.transfer-label{font-size:10px;color:#aeb4c3;text-transform:uppercase;font-weight:950;margin-bottom:4px}.transfer-value{font-size:14px;font-weight:950;color:#fff;word-break:break-all;margin-bottom:7px}
.copy-btn{border:none;border-radius:11px;background:#252b3e;color:#fff;padding:9px 10px;font-size:12px;font-weight:900;cursor:pointer;width:100%}
.file-label{display:flex;align-items:center;justify-content:center;gap:8px;background:#1d2334;border:1px dashed rgba(255,255,255,.20);border-radius:14px;padding:12px;color:#e8ebf5;font-size:13px;font-weight:900;cursor:pointer;margin-bottom:10px;text-transform:none;letter-spacing:0}
.file-preview{display:none;background:rgba(255,255,255,.07);border-radius:13px;padding:8px;margin-bottom:10px;align-items:center;gap:10px}.file-preview.show{display:flex}.file-preview img{width:54px;height:54px;object-fit:cover;border-radius:10px}
.status-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;background:rgba(245,197,66,.12);color:#ffe188;border:1px solid rgba(245,197,66,.25);margin-top:8px}
.widget-compose{border-top:1px solid var(--line);background:#111222;padding:11px;display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:end}#freeInput{min-height:42px;max-height:90px;margin:0;resize:none;border-radius:14px;font-size:14px}.send-btn{height:42px;border:none;border-radius:14px;background:var(--blue);color:#fff;font-weight:950;cursor:pointer}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:60;background:#111827;color:#fff;border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow);padding:12px 15px;border-radius:14px;font-weight:900;font-size:13px;display:none}.toast.show{display:block}
@media(max-width:700px){.float-btn{right:14px;bottom:16px;padding:13px 15px}.widget{right:8px;left:8px;bottom:76px;width:auto;height:72vh;max-height:72vh;border-radius:22px}.quick-grid{grid-template-columns:1fr 1fr}.form-row{grid-template-columns:1fr}.widget-head{padding:14px}}
@media(max-width:390px){.quick-grid{grid-template-columns:1fr}.widget{height:75vh;max-height:75vh}}
</style>
</head>
<body>
<iframe id="appFrame" src="https://bet-300.pw" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<button id="floatBtn" class="float-btn" onclick="toggleWidget(true)"><span>💬</span><span>Cajero / Soporte</span></button>
<section id="widget" class="widget">
  <div class="widget-head"><div><div class="brand-logo"><span>BET</span><span>300</span></div><div class="head-sub">Centro de asistencia integrado</div></div><button class="icon-btn" onclick="toggleWidget(false)">×</button></div>
  <div id="widgetBody" class="widget-body">
    <div class="welcome-card"><div class="welcome-title">Hola 👋</div><div class="welcome-txt">Desde acá podés solicitar cargas, retiros o soporte sin salir de la plataforma.</div>
      <div class="quick-grid">
        <button class="quick gold" onclick="startFlow('CARGA')">💳 Cargar saldo <small>Pedí datos y avisá tu transferencia.</small></button>
        <button class="quick green" onclick="startFlow('RETIRO')">🏧 Solicitar retiro <small>Enviá tu solicitud para revisión.</small></button>
        <button class="quick" onclick="startFlow('SOPORTE')">🆘 Soporte <small>Consultas, acceso o dudas.</small></button>
        <button class="quick" onclick="verEstado()">🧾 Ver estado <small>Consultá tu última solicitud.</small></button>
      </div>
    </div><div id="messages"></div>
  </div>
  <div class="widget-compose"><textarea id="freeInput" rows="1" placeholder="Escribí tu consulta..."></textarea><button class="send-btn" onclick="sendFreeMessage()">➤</button></div>
</section>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL = "https://pjvvyvfcwjoocjqvdror.supabase.co";
const SUPABASE_ANON_KEY = "PEGAR_SUPABASE_ANON_KEY";
const DEFAULT_ROUTE = "rt-a8f31";
const PLATFORM_URL = "https://bet-300.pw";
let sb=null;try{if(SUPABASE_ANON_KEY&&!SUPABASE_ANON_KEY.includes("PEGAR_"))sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){console.warn(e)}
const state={publicCode:new URLSearchParams(location.search).get("r")||DEFAULT_ROUTE,pcCodigo:null,usuario:localStorage.getItem("bet300_usuario")||"",solicitudId:localStorage.getItem("bet300_solicitud_id")||"",selectedFile:null,billetera:null};
function $(id){return document.getElementById(id)}function esc(t){return String(t??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function now(){return new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200)}function scrollBottom(){const b=$("widgetBody");b.scrollTop=b.scrollHeight}function toggleWidget(open){$("widget").classList.toggle("open",!!open);if(open)setTimeout(scrollBottom,80)}
function addMsg(text,who="bot"){const wrap=document.createElement("div");wrap.className="msg "+(who==="user"?"user":"bot");wrap.innerHTML='<div class="bubble">'+String(text)+'</div><div class="meta">'+(who==="user"?"Vos":"BET300")+" · "+now()+'</div>';$("messages").appendChild(wrap);scrollBottom()}
async function rpc(fn,params){if(!sb)return{data:null,error:{message:"Supabase no configurado"}};const{data,error}=await sb.rpc(fn,params||{});return{data,error}}function normalize(data){if(!data)return null;if(Array.isArray(data))return data[0]||null;if(data.data)return Array.isArray(data.data)?data.data[0]:data.data;return data}
async function initRoute(){const r=await rpc("landing_resolver_ruta_publica",{p_public_code:state.publicCode});if(!r.error){const row=normalize(r.data);state.pcCodigo=row?.pc_codigo||row?.pc||row?.codigo_pc||null}if(!state.pcCodigo){const map={"rt-a8f31":"P1","rt-k6d92":"P2","rt-m4q77":"P3","rt-z9p42":"P4","rt-x2v61":"P5"};state.pcCodigo=map[state.publicCode]||"P1"}console.log("[BET300 V16] canal",state.pcCodigo,"ruta",state.publicCode)}
function startFlow(tipo){if(tipo==="CARGA")renderCargaForm();if(tipo==="RETIRO")renderRetiroForm();if(tipo==="SOPORTE")renderSoporteForm()}
function renderCargaForm(){$("messages").insertAdjacentHTML("beforeend",`<div class="form-box"><div class="welcome-title" style="font-size:16px">💳 Solicitud de carga</div><div class="welcome-txt" style="margin-bottom:10px">Informá tus datos. El comprobante es opcional.</div><label>Usuario de plataforma</label><input id="cargaUsuario" value="${esc(state.usuario)}" placeholder="Ej: usuario123"><div class="form-row"><div><label>Monto</label><input id="cargaMonto" type="number" min="1" placeholder="Ej: 5000"></div><div><label>Titular que transfiere</label><input id="cargaTitular" placeholder="Nombre del titular"></div></div><button class="action-btn" onclick="mostrarBilleteraCarga()">Ver datos de carga</button></div>`);scrollBottom()}
async function obtenerBilletera(){const res=await rpc("landing_obtener_billetera",{p_public_code:state.publicCode});if(!res.error){state.billetera=normalize(res.data)||res.data;return state.billetera}return null}
async function mostrarBilleteraCarga(){const usuario=$("cargaUsuario").value.trim(),monto=$("cargaMonto").value.trim(),titular=$("cargaTitular").value.trim();if(!usuario||!monto||!titular)return toast("Completá usuario, monto y titular");state.usuario=usuario;localStorage.setItem("bet300_usuario",usuario);addMsg("Quiero cargar $"+monto+" · Titular: "+esc(titular),"user");const b=await obtenerBilletera();const nombre=b?.nombre_visible||b?.nombre||"Billetera disponible",alias=b?.alias||"",cbu=b?.cbu||b?.cvu||"",banco=b?.banco||b?.tipo||"";$("messages").insertAdjacentHTML("beforeend",`<div class="transfer-card"><div class="transfer-title">BET300 · Datos de carga</div><div class="transfer-field"><div class="transfer-label">Billetera</div><div class="transfer-value">${esc(nombre)}</div></div><div class="transfer-field"><div class="transfer-label">Alias</div><div class="transfer-value">${esc(alias||"Consultar por chat")}</div><button class="copy-btn" onclick="copyText('${esc(alias)}',this)">Copiar alias</button></div><div class="transfer-field"><div class="transfer-label">CBU / CVU</div><div class="transfer-value">${esc(cbu||"Consultar por chat")}</div><button class="copy-btn" onclick="copyText('${esc(cbu)}',this)">Copiar CBU/CVU</button></div><div class="meta">${esc(banco)}</div></div><div class="form-box"><label class="file-label" for="comprobanteFile">📎 Adjuntar comprobante opcional</label><input id="comprobanteFile" type="file" accept="image/*" style="display:none" onchange="previewFile(this)"><div id="filePreview" class="file-preview"></div><button class="action-btn" onclick="enviarSolicitudCarga('${esc(usuario)}','${esc(monto)}','${esc(titular)}')">Ya transferí / Enviar solicitud</button><button class="action-btn secondary-btn" onclick="startFlow('SOPORTE')">Necesito ayuda</button></div>`);scrollBottom()}
async function copyText(t,btn){if(!t)return;await navigator.clipboard.writeText(t);btn.textContent="Copiado";setTimeout(()=>btn.textContent="Copiar",1200)}
function previewFile(input){const f=input.files&&input.files[0];state.selectedFile=f||null;const box=$("filePreview");if(!f){box.classList.remove("show");return}const url=URL.createObjectURL(f);box.innerHTML='<img src="'+url+'"><div><b>Comprobante adjunto</b><div class="meta">'+esc(f.name)+'</div></div>';box.classList.add("show")}
async function enviarSolicitudCarga(usuario,monto,titular){const payload={usuario,monto:Number(monto),titular,pc_codigo:state.pcCodigo,public_code:state.publicCode,tipo:"CARGA",comprobante_obligatorio:false,billetera:state.billetera};let res=await rpc("landing_crear_solicitud_v3_blindado",{p_public_code:state.publicCode,p_usuario:usuario,p_tipo:"CARGA",p_monto:Number(monto),p_titular:titular,p_comprobante_url:null,p_extra:payload});if(res.error){res=await rpc("landing_crear_chat_v2_blindado",{p_public_code:state.publicCode,p_usuario:usuario,p_mensaje:"Solicitud de CARGA: $"+monto+" · Titular: "+titular,p_tipo:"CARGA",p_extra:payload})}if(res.error){addMsg("No pudimos enviar la solicitud automáticamente. Escribinos por acá y un operador te responde.","bot");console.warn(res.error);return}const data=normalize(res.data)||res.data;state.solicitudId=data?.solicitud_id||data?.id||"";if(state.solicitudId)localStorage.setItem("bet300_solicitud_id",state.solicitudId);addMsg('Solicitud recibida ✅<br><span class="status-pill">En verificación</span><br>Vamos a verificar la transferencia con el titular informado. Si es necesario, un operador te pedirá el comprobante.',"bot")}
function renderRetiroForm(){$("messages").insertAdjacentHTML("beforeend",`<div class="form-box"><div class="welcome-title" style="font-size:16px">🏧 Solicitud de retiro</div><div class="welcome-txt" style="margin-bottom:10px">El retiro queda sujeto a revisión de cuenta y saldo disponible.</div><label>Usuario de plataforma</label><input id="retiroUsuario" value="${esc(state.usuario)}" placeholder="Ej: usuario123"><div class="form-row"><div><label>Monto</label><input id="retiroMonto" type="number" min="1" placeholder="Ej: 10000"></div><div><label>Alias/CBU destino</label><input id="retiroDestino" placeholder="Alias o CBU/CVU"></div></div><label>Titular destino</label><input id="retiroTitular" placeholder="Nombre del titular"><button class="action-btn" onclick="enviarSolicitudRetiro()">Enviar retiro a revisión</button></div>`);scrollBottom()}
async function enviarSolicitudRetiro(){const usuario=$("retiroUsuario").value.trim(),monto=$("retiroMonto").value.trim(),destino=$("retiroDestino").value.trim(),titular=$("retiroTitular").value.trim();if(!usuario||!monto||!destino||!titular)return toast("Completá todos los datos del retiro");state.usuario=usuario;localStorage.setItem("bet300_usuario",usuario);addMsg("Solicito retiro de $"+monto,"user");const payload={usuario,monto:Number(monto),destino,titular,pc_codigo:state.pcCodigo,public_code:state.publicCode,tipo:"RETIRO"};let res=await rpc("landing_crear_solicitud_v3_blindado",{p_public_code:state.publicCode,p_usuario:usuario,p_tipo:"RETIRO",p_monto:Number(monto),p_titular:titular,p_destino:destino,p_extra:payload});if(res.error){res=await rpc("landing_crear_chat_v2_blindado",{p_public_code:state.publicCode,p_usuario:usuario,p_mensaje:"Solicitud de RETIRO: $"+monto+" · Destino: "+destino+" · Titular: "+titular,p_tipo:"RETIRO",p_extra:payload})}if(res.error){addMsg("No pudimos enviar el retiro automáticamente. Un operador te responde por acá.","bot");return}addMsg('Retiro recibido 🕓<br><span class="status-pill">En revisión</span><br>El equipo verificará tu saldo y los datos enviados.',"bot")}
function renderSoporteForm(){$("messages").insertAdjacentHTML("beforeend",`<div class="form-box"><div class="welcome-title" style="font-size:16px">🆘 Soporte</div><label>Usuario de plataforma</label><input id="soporteUsuario" value="${esc(state.usuario)}" placeholder="Tu usuario"><label>Consulta</label><textarea id="soporteMensaje" placeholder="Contanos qué necesitás..."></textarea><button class="action-btn" onclick="enviarSoporte()">Enviar consulta</button></div>`);scrollBottom()}
async function enviarSoporte(){const usuario=$("soporteUsuario").value.trim(),mensaje=$("soporteMensaje").value.trim();if(!usuario||!mensaje)return toast("Completá usuario y consulta");state.usuario=usuario;localStorage.setItem("bet300_usuario",usuario);addMsg(mensaje,"user");const res=await rpc("landing_crear_chat_v2_blindado",{p_public_code:state.publicCode,p_usuario:usuario,p_mensaje:mensaje,p_tipo:"SOPORTE",p_extra:{pc_codigo:state.pcCodigo,public_code:state.publicCode}});if(res.error){addMsg("No pudimos crear el chat automáticamente. Intentá nuevamente.","bot");return}addMsg("Consulta enviada ✅ Un operador te responde por este mismo chat.","bot")}
async function sendFreeMessage(){const input=$("freeInput"),txt=input.value.trim();if(!txt)return;input.value="";addMsg(esc(txt),"user");if(!state.usuario){addMsg("Para ayudarte mejor, indicá tu usuario de plataforma o elegí una opción del menú.","bot");return}await rpc("landing_crear_chat_v2_blindado",{p_public_code:state.publicCode,p_usuario:state.usuario,p_mensaje:txt,p_tipo:"SOPORTE",p_extra:{pc_codigo:state.pcCodigo,public_code:state.publicCode}})}
async function verEstado(){if(!state.solicitudId){addMsg("Todavía no encontramos una solicitud reciente en este dispositivo. Podés iniciar una carga, retiro o escribir a soporte.","bot");return}const res=await rpc("landing_estado_solicitud_segura",{p_public_code:state.publicCode,p_solicitud_id:state.solicitudId});if(res.error){addMsg("No pude consultar el estado ahora. Intentá nuevamente en unos minutos.","bot");return}const d=normalize(res.data)||res.data;addMsg("Estado actual: <b>"+esc(d?.estado||"En revisión")+"</b>","bot")}
window.addEventListener("load",async()=>{$("appFrame").src=PLATFORM_URL;await initRoute()});
</script>
</body>
</html>
